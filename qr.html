<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan to open PickleRally</title>
  <style>
    body { font-family: system-ui; text-align: center; padding: 40px; background: #0f172a; color: #f8fafc; }
    img { border-radius: 16px; padding: 16px; background: white; margin: 20px 0; }
    p { color: #94a3b8; font-size: 14px; }
    a { color: #2dd4bf; }
    .hint { font-size: 12px; color: #64748b; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>PickleRally</h1>
  <p>Scan with your phone (same WiFi network)</p>
  <img id="qr" src="" alt="QR Code">
  <p><a id="link" href="">...</a></p>
  <p>App: <a id="app-link" href="">index.html</a></p>
  <p class="hint" id="hint"></p>
  <script>
    (function() {
      var base = location.origin;
      var qr = document.getElementById("qr");
      var link = document.getElementById("link");
      var appLink = document.getElementById("app-link");
      var hint = document.getElementById("hint");
      link.href = base + "/";
      link.textContent = base + "/";
      appLink.href = base + "/index.html";
      qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(base + "/");
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        hint.textContent = "On localhost: use your LAN IP (e.g. http://192.168.x.x:PORT/qr.html) so the QR works on your phone.";
      }
    })();
  </script>
</body>
</html>
